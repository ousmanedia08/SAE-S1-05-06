name: Synchroniser avec GitLab

on:
  push:
    branches:
      - "**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Envoyer les modifications sur GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/TON-GROUPE/TON-PROJET.git" "HEAD:${GITHUB_REF_NAME}"
